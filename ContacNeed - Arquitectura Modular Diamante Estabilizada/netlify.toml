[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  # Supabase URL y anon key son publicas por diseno; Vite las incluye en el bundle.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,VITE_SUPABASE_URL,SUPABASE_ANON_KEY,VITE_SUPABASE_ANON_KEY"

[dev]
  command = "npm run dev"
  port = 3000

[functions]
  directory = "netlify/functions"

