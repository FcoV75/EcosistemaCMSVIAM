<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diapositivas — El cuerpo escucha | CMS VIAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f7f4ea;
      --muted: rgba(247,244,234,.78);
      --accent: #f1c96b;
      --accent-2: #9ad4ff;
      --night: #070910;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); font-family: Montserrat, system-ui, sans-serif; }
    .deck {
      height: 100%;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
    }
    .topbar, .bar {
      display: flex; align-items: center; justify-content: space-between; gap: .7rem;
      padding: .55rem .85rem;
      background: rgba(5,8,16,.88);
      border-bottom: 1px solid rgba(255,255,255,.1);
      font-size: .82rem;
    }
    .bar { border-bottom: 0; border-top: 1px solid rgba(255,255,255,.1); }
    .topbar a, .bar button {
      color: var(--ink); text-decoration: none;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.04);
      border-radius: 999px;
      padding: .35rem .75rem;
      font: inherit; cursor: pointer;
    }
    .bar button.primary {
      background: linear-gradient(135deg, var(--accent), #c9a24d);
      color: #16120a; border: 0; font-weight: 700;
    }
    .slide {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      min-height: 0;
    }
    .visual {
      position: relative;
      overflow: hidden;
      background: #000;
    }
    .visual img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.05) contrast(1.04);
    }
    .visual::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 55%, rgba(7,9,16,.35) 100%);
      pointer-events: none;
    }
    .copy {
      padding: clamp(1.1rem, 3vw, 2.4rem);
      display: flex; flex-direction: column; justify-content: center;
      background:
        radial-gradient(circle at 90% 10%, rgba(241,201,107,.12), transparent 40%),
        linear-gradient(180deg, #0b1020, #070910);
    }
    .kicker {
      color: var(--accent);
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: .72rem;
      font-weight: 700;
      margin: 0 0 .55rem;
    }
    h1 {
      font-family: Cinzel, serif;
      font-size: clamp(1.55rem, 4vw, 2.55rem);
      line-height: 1.12;
      color: #fff3c8;
      margin: 0 0 .8rem;
    }
    .text { font-size: clamp(1.02rem, 2vw, 1.22rem); line-height: 1.55; margin: 0 0 1rem; }
    .note {
      color: var(--muted);
      border-left: 3px solid var(--accent-2);
      padding-left: .8rem;
      margin: 0;
      font-size: .95rem;
    }
    .progress {
      height: 4px; background: rgba(255,255,255,.08);
    }
    .progress > span {
      display: block; height: 100%;
      background: linear-gradient(90deg, var(--accent), #86d6ff);
      width: 0;
    }
    .count { color: var(--accent); font-weight: 700; }
    .help { color: var(--muted); }
    @media (max-width: 860px) {
      .slide { grid-template-columns: 1fr; grid-template-rows: 38vh 1fr; }
      .visual::after { background: linear-gradient(180deg, transparent 40%, rgba(7,9,16,.55) 100%); }
    }
    @media print {
      .topbar, .bar, .progress { display: none; }
      .deck, .slide { height: auto; display: block; }
      .slide { break-after: page; }
    }
  </style>
</head>
<body>
  <div class="deck">
    <div class="topbar">
      <div><a href="index.html">Lecciones</a> · <a href="guia-docente.md">Guía</a></div>
      <div class="count" id="count">1 / 1</div>
      <div class="help">← → espacio · F pantalla</div>
    </div>
    <div class="progress" aria-hidden="true"><span id="bar"></span></div>
    <article class="slide" id="slide">
      <div class="visual"><img id="img" alt="" /></div>
      <div class="copy">
        <p class="kicker" id="kicker"></p>
        <h1 id="title"></h1>
        <p class="text" id="text"></p>
        <p class="note" id="note"></p>
      </div>
    </article>
    <div class="bar">
      <button type="button" id="prev">Anterior</button>
      <span id="etapa"></span>
      <button type="button" class="primary" id="next">Siguiente</button>
    </div>
  </div>
  <script src="slides.js"></script>
  <script>
    const slides = window.CURSO_SLIDES || [];
    let i = 0;
    const $ = (id) => document.getElementById(id);

    function show(n) {
      i = Math.max(0, Math.min(slides.length - 1, n));
      const s = slides[i];
      $("kicker").textContent = s.kicker;
      $("title").textContent = s.title;
      $("text").textContent = s.text;
      $("note").textContent = s.note;
      $("img").src = s.image;
      $("img").alt = s.alt || "";
      $("count").textContent = (i + 1) + " / " + slides.length;
      $("etapa").textContent = "Etapa " + s.etapa;
      $("bar").style.width = ((i + 1) / slides.length * 100) + "%";
      $("prev").disabled = i === 0;
      $("next").textContent = i === slides.length - 1 ? "Fin" : "Siguiente";
      try {
        if (location.protocol !== "about:") history.replaceState(null, "", "#s" + (i + 1));
      } catch (_hist) {}
    }

    $("prev").onclick = () => show(i - 1);
    $("next").onclick = () => show(i + 1);
    document.addEventListener("keydown", (e) => {
      if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(i + 1); }
      if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(i - 1); }
      if (e.key === "Home") show(0);
      if (e.key === "End") show(slides.length - 1);
      if (e.key === "f" || e.key === "F") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
        else document.exitFullscreen().catch(() => {});
      }
    });

    document.addEventListener("click", function (e) {
      var a = e.target && e.target.closest ? e.target.closest("a") : null;
      if (!a) return;
      var href = a.getAttribute("href");
      if (!href) return;
      var embedded = false;
      try { embedded = window.top !== window.self; } catch (err) { embedded = true; }
      if (!embedded) return;
      if (href === "index.html" || href.indexOf("guia-docente") !== -1) {
        e.preventDefault();
        if (href === "index.html") {
          try { window.parent.postMessage({ type: "cn-curso", action: "lecciones" }, "*"); } catch (err) {}
        }
      }
    }, true);

    const start = Number((location.hash.match(/\d+/) || [1])[0]) - 1;
    show(start);
  </script>
</body>
</html>
