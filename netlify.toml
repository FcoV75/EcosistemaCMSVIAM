[build]
  publish = "."
  command = "echo Static VIAM CMS"

[functions]
  directory = "netlify/functions"

[functions.organo-piloto]
  timeout = 26

[functions.organo-transcribe]
  timeout = 26

[functions.chat]
  timeout = 26

[functions.member-chat]
  timeout = 26

[functions.transcribe-audio]
  timeout = 26

[functions.transcribe-proxy]
  timeout = 300

[functions.render-proxy]
  timeout = 300

[functions.railway-path-proxy]
  timeout = 300

[functions.estudio-voz]
  timeout = 60

[functions.estudio-clip]
  timeout = 60

[functions.download-libro]
  included_files = ["Assets/Docs/**"]

[[redirects]]
  from = "/Assets/Docs/:archivo"
  to = "/.netlify/functions/download-libro?archivo=:archivo"
  status = 302
  force = true

