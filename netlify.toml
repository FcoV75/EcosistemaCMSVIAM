[build]
  publish = "."
  command = "echo Static VIAM CMS"

[functions]
  directory = "netlify/functions"

[functions.transcribe-audio]
  timeout = 26

[functions.transcribe-proxy]
  timeout = 300

[functions.render-proxy]
  timeout = 300

[functions.railway-path-proxy]
  timeout = 300

[functions.estudio-voz]
  timeout = 60

[functions.estudio-clip]
  timeout = 60

[functions.download-libro]
  included_files = ["Assets/Docs/**"]

[[redirects]]
  from = "/Assets/Docs/:archivo"
  to = "/.netlify/functions/download-libro?archivo=:archivo"
  status = 302
  force = true

[[redirects]]
  from = "/video_diamante"
  to = "/video_diamante.html"
  status = 200

[[redirects]]
  from = "/mi-ecosistema"
  to = "/mi-ecosistema.html"
  status = 200

[[redirects]]
  from = "/panel-fundador"
  to = "/panel-fundador.html"
  status = 200

[[redirects]]
  from = "/obras"
  to = "/obras.html"
  status = 200

[[redirects]]
  from = "/nexus"
  to = "/nexus.html"
  status = 200

[[redirects]]
  from = "/musica"
  to = "/musica.html"
  status = 200

[[redirects]]
  from = "/curso-promotores"
  to = "/curso-promotores.html"
  status = 200
